paths:
  train_images: data/raw/coco2017/train2017
  val_images: data/raw/coco2017/val2017
  train_annotations: data/raw/coco2017/annotations/captions_train2017.json
  val_annotations: data/raw/coco2017/annotations/captions_val2017.json
  vocab: data/processed/vocab.pickle
  checkpoint: checkpoints/best_model.pth
  last_checkpoint: checkpoints/last_checkpoint.pth
  pretrained_checkpoint: checkpoints/best_model.pth

data:
  freq_threshold: 5        # từ xuất hiện < 5 lần -> <unk>
  max_len: 30               # độ dài caption tối đa (dùng khi lọc/sinh)
  image_size: 224

model:
  vit_name: "vit_b_16"      # ViT backbone từ torchvision
  d_model: 512              # Chiều biểu diễn ẩn Transformer
  nhead: 8                  # Số head trong Multi-Head Attention
  num_decoder_layers: 3     # Số tầng Transformer Decoder (theo yêu cầu: 3 tầng)
  dim_feedforward: 2048     # Chiều tầng ẩn FFN bên trong Transformer
  dropout: 0.1              # Dropout rate chuẩn cho Transformer
  train_backbone: false     # Đóng băng hoàn toàn ViT backbone
  tie_weights: true         # Chia sẻ trọng số giữa embedding và fc output layer

train:
  resume: true
  seed: 42
  batch_size: 64
  lr: 0.0003
  lr_finetune: 0.00001
  epochs: 30
  grad_clip: 1.0
  num_workers: 2
  early_stopping_patience: 5
  lr_scheduler_patience: 2
  lr_scheduler_factor: 0.5

evaluation:
  method: beam
  beam_size: 3
  batch_size: 16
  num_workers: 2
